    depth_refine_min_mask_area: 80
    depth_refine_min_core_pixels: 30
    depth_refine_min_valid_ratio: 0.20
    depth_refine_keep_largest_component: true
    draw_removed_pixels: true
    draw_original_contour: true
    draw_refined_contour: true
    mask_alpha: 0.35
